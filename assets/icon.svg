<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Transcript Copier icon">
<title>Transcript Copier</title>
<!-- Drawn on a 16-unit grid (16 px each) so the bars stay sharp at toolbar sizes. -->
<rect width="256" height="256" rx="56" fill="#0B0C14"/>
<!-- play -->
<path d="M42 58 L126 128 L42 198 Z" fill="#FF0033" stroke="#FF0033" stroke-width="20" stroke-linejoin="round"/>
<!-- transcript lines -->
<rect x="160" y="48" width="64" height="32" rx="16" fill="#F5F3EF"/>
<rect x="160" y="112" width="64" height="32" rx="16" fill="#F5F3EF"/>
<rect x="160" y="176" width="48" height="32" rx="16" fill="#F5F3EF"/>
</svg>
